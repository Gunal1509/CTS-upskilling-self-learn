<!DOCTYPE html>
<html>
<head>
<title>Community Portal</title>
<script src="main.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="text-center mt-4">
        <h1 class="badge text-bg-primary fs-2 p-3 shadow p-3">Community Portal</h1>
    </div>
    <div class="container mt-4">
            <div class="d-flex justify-content-center mt-5">
            <div class="card border border-primary shadow p-4" style="width: 350px;">
            <h3 class="text-center text-primary mb-4">Event Registration</h3>
            <form>
                <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name" required>
                <input type="date" id="date"  class="form-control mb-3"  required>
                <input type="number" id="seats" class="form-control mb-3" placeholder="Enter Seats" required>

                <button type="button" class="btn btn-primary w-100" onclick="handlelog()"> Submit</button>
             </form>
            </div>
        </div>
        </div>
            <div class="d-flex justify-content-center mt-5">
            <div id="resultCard" class="card border border-success shadow p-4" style="width: 350px; display:none;">
                <h4 class="text-success">Registration Details</h4>

                <p id="result"></p>
                    </div>
            </div>
        </div>
        </body>
</html>
