<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Typography</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1 class="display-1">Community Event Portal</h1>

    <p class="lead">
        Welcome to the biggest community event platform.
    </p>

    <p class="text-muted">
        This is a muted text example.
    </p>

    <p class="fw-bold">
        This text is bold.
    </p>

    <p class="fw-light">
        This text is light.
    </p>

    <p class="fst-italic">
        This text is italic.
    </p>

</div>

</body>
</html>
