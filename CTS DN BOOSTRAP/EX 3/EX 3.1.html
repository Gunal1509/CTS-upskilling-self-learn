<!DOCTYPE html>
<html>
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="row">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3 text-center">
                Column 1
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3 text-center">
                Column 2
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3 text-center">
                Column 3
            </div>
        </div>

    </div>

</div>

</body>
</html>
