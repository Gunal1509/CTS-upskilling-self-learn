<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Colors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Dashboard</h2>

    <div class="p-3 mb-3 bg-primary text-white">
        Primary Section
    </div>

    <div class="p-3 mb-3 bg-success text-white">
        Success Section
    </div>

    <div class="p-3 mb-3 bg-warning text-dark">
        Warning Section
    </div>

    <div class="p-3 mb-3 bg-danger text-white">
        Danger Section
    </div>

    <div class="p-3 mb-3 bg-info text-dark">
        Info Section
    </div>

</div>

</body>
</html>
