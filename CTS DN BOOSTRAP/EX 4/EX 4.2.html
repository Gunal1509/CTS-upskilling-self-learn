<!DOCTYPE html>
<html>
<head>
    <title>Four Column Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-3">

    <div class="row">

        <div class="col-sm-3 border p-3 text-center">
            Column 1
        </div>

        <div class="col-sm-3 border p-3 text-center">
            Column 2
        </div>

        <div class="col-sm-3 border p-3 text-center">
            Column 3
        </div>

        <div class="col-sm-3 border p-3 text-center">
            Column 4
        </div>

    </div>

</div>

</body>
</html>
