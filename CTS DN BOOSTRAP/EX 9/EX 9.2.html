<!DOCTYPE html>
<html>
<head>
    <title>Button Groups</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Button Group</h2>

    <div class="btn-group">
        <button class="btn btn-primary">Home</button>
        <button class="btn btn-primary">Events</button>
        <button class="btn btn-primary">Contact</button>
    </div>

    <hr>

    <h2>Toggle Buttons</h2>

    <input type="checkbox" class="btn-check" id="music">
    <label class="btn btn-outline-success" for="music">
        Music
    </label>

    <input type="checkbox" class="btn-check" id="sports">
    <label class="btn btn-outline-danger" for="sports">
        Sports
    </label>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
