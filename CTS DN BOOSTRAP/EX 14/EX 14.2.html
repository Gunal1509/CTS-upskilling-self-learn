<!DOCTYPE html>
<html>
<head>
    <title>Responsive Sidebar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 bg-dark text-white p-3 d-none d-md-block">

            <h4>Sidebar</h4>

            <ul class="list-unstyled">
                <li>Home</li>
                <li>Events</li>
                <li>Contact</li>
            </ul>

        </div>

        <!-- Main Content -->
        <div class="col-md-9 p-3">

            <h2>Main Content</h2>

            <p>
                This content is visible on all devices.
            </p>

        </div>

    </div>

</div>

</body>
</html>
