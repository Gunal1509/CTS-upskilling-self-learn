<!DOCTYPE html>
<html>
<head>
    <title>Pricing Section</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-5">
        Pricing Plans
    </h2>

    <div class="row">

        <div class="col-md-4">

            <div class="card p-3 m-3 text-center">

                <h3>Basic</h3>

                <h4>₹499</h4>

                <p>1 Month Access</p>

                <button class="btn btn-primary">
                    Choose Plan
                </button>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3 m-3 text-center">

                <h3>Standard</h3>

                <h4>₹999</h4>

                <p>3 Months Access</p>

                <button class="btn btn-success">
                    Choose Plan
                </button>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3 m-3 text-center">

                <h3>Premium</h3>

                <h4>₹1499</h4>

                <p>1 Year Access</p>

                <button class="btn btn-danger">
                    Choose Plan
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
